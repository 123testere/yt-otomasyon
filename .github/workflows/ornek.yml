name: Örnek video (yüklemeden)

on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: 'Senaryo dosyası (repo kökünden), ör. ornekler/kaan-ai-lab.json'
        required: true

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/eleven
          key: eleven-${{ github.run_id }}
          restore-keys: eleven-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v3
      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji > /dev/null
          pip install -q -r engine/py/requirements.txt
          (cd engine && npm ci)
          (cd remotion && npm ci && npx remotion browser ensure)
      - run: node src/ornek.js "../${{ inputs.senaryo }}" ../ornek-cikti
        working-directory: engine
        env:
          PYTHON: python
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ornek-video
          path: ornek-cikti/
          retention-days: 7
