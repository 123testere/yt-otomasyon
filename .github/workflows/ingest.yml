name: Senaryoları al

# Claude rutini senaryoları claude/... dalına gönderir (bulut rutinleri genelde main'e doğrudan
# yazamaz). Bu iş akışı sadece queue/ dosyalarını main'e alır, dalı siler ve üretimi başlatır.
on:
  push:
    branches: ['claude/**']
    paths: ['queue/**', 'analiz/**', 'cevaplar/**', 'iyilestirme/**', 'kesif/**', 'diziler/kesif-*.json', 'mekanlar/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kuyruk dosyalarını main'e al
        id: al
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "otomasyon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # Sadece queue/ altında yeni eklenen dosyalar; config veya kod değişiklikleri alınmaz.
          files=$(git diff --name-only --diff-filter=A "origin/main...origin/$BRANCH" -- 'queue/*.json')
          # Haftalık yorumlu rapor (analiz/) ve yorum cevapları (cevaplar/) da alınır.
          extra=$(git diff --name-only --diff-filter=AM "origin/main...origin/$BRANCH" -- 'analiz/*.json' 'cevaplar/*.json' 'iyilestirme/*.json' 'kesif/*/*.json' 'diziler/kesif-*.json' 'mekanlar/*.json')
          if [ -z "$files$extra" ]; then echo "Yeni dosya yok."; git push origin --delete "$BRANCH" || true; exit 0; fi
          git checkout "origin/$BRANCH" -- $files $extra
          if echo "$extra" | grep -q '^iyilestirme/'; then echo "iyilestir=1" >> "$GITHUB_OUTPUT"; fi
          if echo "$extra" | grep -q '^kesif/'; then echo "kesif=1" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$files" ]; then
            echo "uret=1" >> "$GITHUB_OUTPUT"
            node engine/src/validate.js || echo "Uyarı: doğrulamadan geçmeyen dosyalar üretimde 'geçersiz' olarak işaretlenecek."
          fi
          git add $files $extra
          git commit -m "içerik: $(echo -n "$files" | grep -c .) senaryo, $(echo -n "$extra" | grep -c .) rapor/cevap ($BRANCH)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          git push origin --delete "$BRANCH" || true
      - name: Üretimi başlat
        if: steps.al.outputs.uret
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run produce.yml --ref main
      # Günlük iyileştirme dosyası geldiyse senkronizasyon hemen çalışıp kapak/başlık değişikliklerini uygular.
      # Keşif pilot senaryosu geldiyse örnek video üretilir (hiçbir kanala yüklenmez)
      - name: Keşif örneğini üret
        if: steps.al.outputs.kesif
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kesif-ornek.yml --ref main
      - name: İyileştirmeleri uygula
        if: steps.al.outputs.iyilestir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref main
