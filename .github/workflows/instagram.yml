name: Instagram Reels paylaş

# Shorts yayın saatinde (Lamba Altında: 19:00 TR = 16:00 UTC) birkaç kez çalışır; saatlik senkronizasyon
# gecikse bile Reels zamanında gider. Sabah çalışması bağlantıyı yoklar (bozuksa yayından önce haber verir).
# Shorts saati değişirse buradaki saatleri de güncelle.
on:
  schedule:
    - cron: '7 6 * * *'
    - cron: '4,22,41 16 * * *'
    - cron: '13 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --omit=dev
        working-directory: engine
      - run: node src/instagram.js
        working-directory: engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
