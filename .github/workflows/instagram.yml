name: Instagram Reels paylaş

# Saatte bir çalışır (Shorts yayın saati v4 kuralıyla kayabildiği için sabit saat yok); yayın saati geçen Reels/TikTok gönderilir.
# Sabah çalışması bağlantıyı da yoklar. Her çalışma ~20 sn.
on:
  schedule:
    - cron: '7 6 * * *'
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --omit=dev
        working-directory: engine
      - run: node src/instagram.js
        working-directory: engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
