name: Keşif örneği üret

# Claude'un yazdığı pilot senaryoları (kesif/<id>/pilot.json) render eder; hiçbir kanala yüklemez.
# "Senaryoları al" iş akışı kesif/ dosyası gelince bunu tetikler; elle de çalıştırılabilir.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Keşif kanal kimliği (boşsa bekleyen hepsi)'
        required: false

concurrency:
  group: kesif-ornek
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v3
      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji > /dev/null
          pip install -q -r engine/py/requirements.txt
          (cd engine && npm ci)
          (cd remotion && npm ci && npx remotion browser ensure)
      - run: node src/kesif-ornek.js ${{ inputs.id }}
        working-directory: engine
        env:
          PYTHON: python
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
