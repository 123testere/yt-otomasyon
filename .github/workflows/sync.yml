name: Ayarları senkronize et

on:
  schedule:
    - cron: '17 * * * *' # her saat
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
        working-directory: engine
      # Flaggenduell sıralamaları için FAOSTAT toplu verisi (~34 MB); ay bazında önbellekte tutulur.
      - id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/faostat
          key: faostat-${{ steps.month.outputs.m }}
      - run: node src/sync.js
        id: sync
        working-directory: engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TV_CLIENT_ID: ${{ secrets.YT_TV_CLIENT_ID }}
          YT_TV_CLIENT_SECRET: ${{ secrets.YT_TV_CLIENT_SECRET }}
      # Uygulamadaki kanal kurulum sihirbazı: banner ve profil fotoğrafı Remotion ile çizilir.
      - if: steps.sync.outputs.kurulum
        name: Kanal kurulumu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          (cd remotion && npm ci && npx remotion browser ensure)
          (cd engine && node src/kurulum.js)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TV_CLIENT_ID: ${{ secrets.YT_TV_CLIENT_ID }}
          YT_TV_CLIENT_SECRET: ${{ secrets.YT_TV_CLIENT_SECRET }}
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "otomasyon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          git diff --cached --quiet && exit 0
          git commit -m "ayarlar: senkronizasyon"
          git pull --rebase
          git push
