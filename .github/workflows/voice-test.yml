name: Ses klonu denemesi

# Kanalın ses örneğiyle Chatterbox'tan kısa bir deneme seslendirmesi üretir; sonuç "Artifacts" altında.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Kanal kimliği
        required: true
      language:
        description: Dil kodu (tr, en, de…)
        default: tr
      text:
        description: Okunacak metin (| ile sahnelere böl)
        default: "Evlat, bugün sana yüzyıllardır çözülemeyen bir sırrı anlatacağım. | Hazırsan başlayalım, çünkü bu hikâyenin sonu seni çok şaşırtacak."

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git"
          (cd engine && npm ci)
      - name: Ses örneğini al
        working-directory: engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p /tmp/ses
          node src/voice.js indir "${{ inputs.channel }}" /tmp/ses/ornek.mp3
          ffmpeg -y -v error -i /tmp/ses/ornek.mp3 -ac 1 -ar 24000 /tmp/ses/ornek.wav
      - name: Seslendir
        env:
          TEXT: ${{ inputs.text }}
        run: |
          node -e "console.log(JSON.stringify(process.env.TEXT.split('|').map(s=>s.trim()).filter(Boolean)))" > /tmp/ses/metin.json
          mkdir -p /tmp/ses/cikti
          time python engine/py/clone_tts.py /tmp/ses/ornek.wav "${{ inputs.language }}" /tmp/ses/metin.json /tmp/ses/cikti
          ffmpeg -y -v error -f concat -safe 0 -i <(for f in /tmp/ses/cikti/*.wav; do echo "file '$f'"; done) -c:a libmp3lame -q:a 2 /tmp/ses/deneme.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: ses-denemesi
          path: /tmp/ses/deneme.mp3
          retention-days: 7
