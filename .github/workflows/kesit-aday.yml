name: Kesit adayları (Vice City Dispatch, gece)

# Gece rutininden (≈03:00 TR) önce: kampanyalardaki en çok izlenen GTA 6 klipleri indirilir, konuşma dökümü (Whisper)
# ve 3 kare çıkarılır → kesit-aday/. Rutin her klibe kendi yorumumuzu (ekran yazısı) yazıp kuyruğa koyar.
on:
  schedule:
    - cron: '30 22 * * *' # TR 01:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  aday:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r engine/py/requirements.txt
          (cd engine && npm ci)
      - run: node src/kesit-aday.js
        working-directory: engine
        env:
          PYTHON: python
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A kesit-aday
          git commit -q -m "kesit adayları: $(date -u +%F)" || exit 0
          git pull -q --rebase -X theirs && git push -q
