name: Kesit önizleme (yüklemeden)

# Her aktif kampanyadan en çok izlenen 1 klibi Vice City Dispatch kurgusuyla üretir; YouTube'a YÜKLEMEZ, dosya olarak bırakır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onizle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji > /dev/null
          pip install -q -r engine/py/requirements.txt
          (cd engine && npm ci)
          (cd remotion && npm ci && npx remotion browser ensure)
      - run: node src/klip-twitch.js --onizleme /tmp/isler && node src/kesit-onizle.js /tmp/isler /tmp/onizleme
        working-directory: engine
        env:
          PYTHON: python
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: kesit-onizleme
          path: /tmp/onizleme
